name: Publish Flux artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  SYNCROOT_ARTIFACT_NAME: arbeidsflate/syncroot
  APP_ARTIFACT_NAME: arbeidsflate/arbeidsflate-sync

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-flux-artifacts-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-syncroot:
    name: Publish syncroot artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate syncroot structure
        shell: bash
        run: |
          set -euo pipefail

          render_kustomize() {
            local path="$1"
            if command -v kustomize >/dev/null 2>&1; then
              kustomize build "$path"
              return
            fi
            if command -v kubectl >/dev/null 2>&1; then
              kubectl kustomize "$path"
              return
            fi
            echo "::error::Neither 'kustomize' nor 'kubectl' found in runner PATH."
            exit 1
          }

          # flux/syncroot/base pins spec.path of both Flux Kustomizations to one
          # environment, so every overlay must patch them. An overlay that forgets
          # would publish a syncroot that deploys the base environment's manifests
          # instead of its own. Assert on the rendered paths, per Kustomization:
          # a patch aimed at the wrong resource name parses fine but never
          # applies, leaving the base's hardcoded spec.path in place.
          rendered_path() {
            # Prints spec.path of the named Flux Kustomization in a kustomize render.
            awk -v want="$1" '
              /^---/ { kind = ""; name = "" }
              /^kind: / { kind = $2 }
              kind == "Kustomization" && /^  name: / { name = $2 }
              kind == "Kustomization" && name == want && /^  path: / { print $2 }
            '
          }

          for dir in ./manifests/environments/*/; do
            env=$(basename "$dir")
            overlay="./flux/syncroot/${env}/kustomization.yaml"

            if [ ! -f "$overlay" ]; then
              echo "::error::Missing ${overlay}"
              exit 1
            fi

            rendered=$(render_kustomize "./flux/syncroot/${env}")
            for pair in "arbeidsflate-apps=./environments/${env}" "arbeidsflate-frontend=./environments/${env}/frontend"; do
              name="${pair%%=*}"
              expected="${pair#*=}"
              selected=$(printf '%s\n' "$rendered" | rendered_path "$name")
              if [ "$selected" != "$expected" ]; then
                echo "::error::./flux/syncroot/${env}/ gives ${name} the path '${selected:-<none>}' but must give it ${expected}"
                exit 1
              fi
            done
          done

      - name: Build and push syncroot artifact
        uses: Altinn/altinn-platform/actions/flux/build-push-image@470eaf98af2ab545e7e840055a538d73e40c3c80 # main
        with:
          image_name: ${{ env.SYNCROOT_ARTIFACT_NAME }}
          tag: at23
          workdir: ./flux/syncroot
          azure_subscription_id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}
          azure_app_id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}

  publish-app-manifests:
    name: Publish app manifests artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate app manifests structure
        shell: bash
        run: |
          set -euo pipefail

          for dir in ./manifests/environments/*/; do
            env=$(basename "$dir")
            for file in "./manifests/environments/${env}/kustomization.yaml" "./manifests/environments/${env}/frontend/kustomization.yaml"; do
              if [ ! -f "$file" ]; then
                echo "Error: Missing ${file}"
                exit 1
              fi
            done
          done

          for dir in ./manifests/apps/*/ ./manifests/jobs/*/; do
            if [ ! -f "${dir}base/kustomization.yaml" ]; then
              echo "Error: Missing ${dir}base/kustomization.yaml"
              exit 1
            fi
          done

          if [ -d "./manifests/apps/components" ] || [ -d "./manifests/apps/base" ]; then
            echo "Error: Legacy app manifest paths detected (manifests/apps/components or manifests/apps/base)."
            exit 1
          fi

          if grep -R --include='kustomization.yaml' -n 'patchesStrategicMerge' ./manifests/environments; then
            echo "Error: Found deprecated patchesStrategicMerge usage."
            exit 1
          fi

          build_kustomize() {
            local path="$1"
            if command -v kustomize >/dev/null 2>&1; then
              kustomize build "$path" >/dev/null
              return
            fi
            if command -v kubectl >/dev/null 2>&1; then
              kubectl kustomize "$path" >/dev/null
              return
            fi
            echo "Error: Neither 'kustomize' nor 'kubectl' found in runner PATH."
            exit 1
          }

          for dir in ./manifests/environments/*/; do
            env=$(basename "$dir")
            build_kustomize "./manifests/environments/${env}"
            build_kustomize "./manifests/environments/${env}/frontend"
            build_kustomize "./flux/syncroot/${env}"
          done

      - name: Build and push app manifests artifact
        uses: Altinn/altinn-platform/actions/flux/build-push-image@470eaf98af2ab545e7e840055a538d73e40c3c80 # main
        with:
          image_name: ${{ env.APP_ARTIFACT_NAME }}
          tag: main
          workdir: ./manifests
          azure_subscription_id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}
          azure_app_id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}
