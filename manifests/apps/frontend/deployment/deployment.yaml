apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: arbeidsflate
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: arbeidsflate
        azure.workload.identity/use: "true"
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        linkerd.io/inject: enabled
    spec:
      serviceAccountName: frontend
      containers:
        - name: frontend
          image: ghcr.io/altinn/dialogporten-frontend-frontend:set-by-ci
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: frontend-runtime
          env:
            - name: NODE_ENV
              value: production
            - name: APPLICATION_INSIGHTS_DISABLE_DEPENDENCY_TRACKING
              value: "true"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
